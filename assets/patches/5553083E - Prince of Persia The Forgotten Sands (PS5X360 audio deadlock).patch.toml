title_name = "Prince of Persia: The Forgotten Sands"
title_id = "5553083E"
hash = "B38C97F206A6B314"

# PS5X360: the game's statically linked XAudio2 takes its API lock and then a
# voice lock in GetState (82D05EC8 -> 82D058B8), while the XAudio2 processing
# thread holds the voice lock and calls the game's OnBufferStart callback, which
# calls GetState and so asks for the API lock: opposite orders. Under emulation
# the two threads meet in that window (the loading screen froze at 0 FPS after
# 40-160 s on the PS5, threads F8000208 and F8000218). GetState keeps the voice
# lock (the state it reads stays consistent) and no longer takes the API lock.
# Evidence: build/prince-host-20261009/static-evidence.txt and the console stall
# snapshot of session 20261009-164905.

[[patch]]
    name = "Fix audio deadlock on the loading screen"
    desc = "XAudio2 GetState no longer takes the engine API lock (the voice lock stays). Fixes the loading freeze at 0 FPS."
    author = "PS5X360"
    is_enabled = true

    [[patch.be32]]
        address = 0x82D05EF8
        value = 0x60000000

    [[patch.be32]]
        address = 0x82D05F58
        value = 0x60000000
