<!doctype html>
<html lang="en">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="ps5x360-host" content="relay">
<title>PS5X360E Kinect</title>
<style>
:root{--ink:#0a0c11;--surface:#151a22;--edge:#2a313d;--text:#eef3f6;--body:#c4ccd4;--muted:#7f8a96;--accent:#35d07f;--warn:#f0b446;--left:#4cc9f0;--right:#ff9f43}
*{box-sizing:border-box}
body{background:var(--ink);color:var(--text);font:17px/1.45 system-ui,sans-serif;margin:0 auto;max-width:960px;padding:16px}
h1{font-size:24px;margin:4px 0 2px}h2{font-size:17px;margin:0 0 10px;color:var(--accent);letter-spacing:.04em;text-transform:uppercase}
p{margin:6px 0}small,.muted{color:var(--muted)}
section{background:var(--surface);border:1px solid var(--edge);border-radius:14px;padding:14px;margin:12px 0}
.row{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
label{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--body)}
input,select{font:inherit;color:var(--text);background:#0e1218;border:1px solid var(--edge);border-radius:9px;padding:9px 10px;min-width:0}
button{background:var(--accent);color:#06210f;border:0;border-radius:10px;padding:11px 16px;font:600 16px system-ui,sans-serif}
button.secondary{background:#232a35;color:var(--text)}button:disabled{opacity:.4}
#stage{position:relative;margin:12px 0}
canvas{display:block;width:100%;border-radius:14px;background:#05070a}
video{display:none}
#status{font-weight:600}
pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px;color:var(--body)}
progress{width:100%;accent-color:var(--accent)}
body.focus{padding:0;max-width:none}
body.focus>*:not(#stage){display:none}
body.focus #stage{margin:0;height:100vh;height:100dvh;display:flex;align-items:center;justify-content:center;background:#000}
body.focus canvas{width:100vw;height:100vh;height:100dvh;object-fit:contain;border-radius:0}
#exit-focus{display:none;position:absolute;right:12px;top:12px}
body.focus #exit-focus{display:block}
</style>
<h1>PS5X360E Kinect</h1>
<p class="muted" data-t="intro"></p>

<section>
 <h2 data-t="ps5"></h2>
 <div class="row">
  <label><span data-t="key_label"></span><input id="key" type="password" maxlength="6" autocomplete="off"></label>
  <button id="connect" data-t="connect"></button><button id="disconnect" class="secondary" data-t="disconnect"></button>
 </div>
 <p id="relay" role="status"></p><p id="game" class="muted" role="status"></p>
</section>

<section>
 <h2 data-t="camera"></h2>
 <div class="row">
  <label><span data-t="camera_label"></span><select id="camera"><option value="user" data-t="front"></option><option value="environment" data-t="back"></option></select></label>
  <label><span data-t="quality_label"></span><select id="quality"><option value="lite" data-t="q_lite"></option><option value="full" data-t="q_full" selected></option><option value="heavy" data-t="q_heavy"></option></select></label>
 </div>
 <div class="row" style="margin-top:10px">
  <button id="start" data-t="start"></button><button id="stop" class="secondary" data-t="stop" disabled></button>
  <button id="focus" class="secondary" data-t="focus" disabled></button>
 </div>
 <p id="status" role="status"></p>
</section>

<div id="stage"><canvas id="canvas" width="640" height="480"></canvas><button id="exit-focus" class="secondary" data-t="focus_exit"></button></div>
<video id="video" autoplay muted playsinline></video>

<section>
 <h2 data-t="motion"></h2>
 <div class="row">
  <label><span data-t="mode_label"></span><select id="mode"><option value="kinect" data-t="mode_kinect"></option><option value="original" data-t="mode_original"></option></select></label>
  <label><span data-t="distance_label"></span><input id="distance" type="number" min="1" max="3.8" step="0.1" value="2.5" inputmode="decimal" style="width:7em"></label>
  <label><span data-t="sides_label"></span><select id="sides"><option value="normal" data-t="sides_normal"></option><option value="mirror" data-t="sides_mirror"></option></select></label>
  <label><span data-t="reach_label"></span><select id="reach"><option value="1" data-t="reach_normal"></option><option value="1.25" data-t="reach_more"></option><option value="1.5" data-t="reach_max"></option></select></label>
 </div>
 <div class="row" style="margin-top:10px"><button id="recenter" class="secondary" data-t="recenter" disabled></button></div>
 <p id="calibration" role="status"></p><progress id="progress" max="1" value="0"></progress>
 <p class="muted" data-t="how"></p>
</section>

<details><summary data-t="diag"></summary>
 <pre id="pose"></pre><button id="save" class="secondary" data-t="export" disabled></button>
</details>
<p><small data-t="privacy"></small></p>

const remembered = (() => { try { return JSON.parse(localStorage.getItem('ps5x360-kinect') || '{}'); } catch { return {}; } })();

function remember() {
  try { localStorage.setItem('ps5x360-kinect', JSON.stringify({camera: cameraChoice.value, quality: quality.value, mode: mode.value, distance: distance.value, reach: reach.value, sides: sides.value})); } catch {}
}

const applyMotionSettings = () => {

  try { tracker.setStartDistance(Number.isFinite(d) ? Math.min(3.8, Math.max(1, d)) : BODY_DISTANCE); } catch {}
  try { tracker.setReach(Number(reach.value)); } catch {}
  tracker.setMirror(sides.value === 'mirror');
  gestures.reset(); remember();
};
applyMotionSettings();
distance.onchange = applyMotionSettings;
reach.onchange = () => { try { tracker.setReach(Number(reach.value)); } catch {} remember(); };
mode.onchange = () => { tracker.resetCalibration(); gestures.reset(); remember(); };
recenter.onclick = () => { tracker.resetCalibration(); gestures.reset(); };
cameraChoice.onchange = quality.onchange = remember;
sides.onchange = () => { tracker.setMirror(sides.value === 'mirror'); gestures.reset(); remember(); };

// new tracking identity on the console, and the game starts looking for its player again,
// so the last pose is kept for up to a second before the body is reported lost.
const GRACE_MS = 1000;
let lastGood = null, pairing = 'none', sentTimes = [];
// Served by the console itself (its HTTPS server marks the page), or by the PC relay.
const onConsole = document.querySelector('meta[name="ps5x360-host"]')?.content === 'ps5';
const addressKey = new URLSearchParams(location.hash.slice(1)).get('k');

// One pose frame as the console's motion receiver takes it (XMP1, 336 bytes, little-endian).
function packFrame(session, sequence, tracked, joints) {
  const buffer = new ArrayBuffer(336), view = new DataView(buffer);
  [88, 77, 80, 49].forEach((c, i) => view.setUint8(i, c));
  view.setUint32(4, sequence, true); view.setUint32(8, session, true); view.setUint32(12, tracked ? 1 : 0, true);
  joints.forEach((j, n) => {
    const at = 16 + n * 16;
    view.setFloat32(at, j.x, true); view.setFloat32(at + 4, j.y, true); view.setFloat32(at + 8, j.z, true);
    view.setFloat32(at + 12, Math.max(0, Math.min(1, j.confidence)), true);
  });
  return buffer;
}
let motionSession = {session: 0, sequence: 0}, pendingLost = null, lastTracked = null, fps = 0, lastFrameAt = 0, lastVideoTime = -1;
relay.textContent = T('disconnected');
status.textContent = demo ? T('demo') : T('camera_off');

function showPose(pose, extra) {
  if (!pose) { poseStatus.textContent = '—'; return; }
  const names = [[0, 'Hip centre'], [2, 'Shoulder centre'], [6, 'Left wrist'], [7, 'Left hand'], [10, 'Right wrist'], [11, 'Right hand']];
  poseStatus.textContent = pose.joints.filter(j => j.confidence >= .5).length + '/20 joints at confidence >= 0.50\n' +
    (extra ? extra + '\n' : '') + names.map(([n, name]) => {
      const j = pose.joints[n];
      return name + ' [' + n + ']: X ' + j.x.toFixed(3) + ' Y ' + j.y.toFixed(3) + ' Z ' + j.z.toFixed(3) + ' confidence ' + j.confidence.toFixed(2);
    }).join('\n');
}

// What the game on the console is doing with the pose, asked every two seconds.
setInterval(async () => {
  if (!paired) { game.textContent = ''; return; }
  try {
    const response = onConsole ? await fetch('/api/motion/status', {headers: {'X-Key': consoleKey}, cache: 'no-store'}) :
      await fetch('/relay/status'); if (!response.ok) return;
    const s = await response.json();
    game.textContent = s.guest_skeleton_bound ? T('game_bound', s.guest_skeleton_frames, s.guest_skeleton_bodies) :
      s.guest_camera_open ? T('game_no_skeleton') : T('game_no_camera');
  } catch {}
}, 2000);

async function sendPose(pose, queuedSession = null) {
  if (!paired && !queuedSession) return;
  const target = queuedSession || motionSession;
  if (inFlight >= 2) { if (!pose) pendingLost = target; return; }
  if (++target.sequence > 0xffffffff) { if (target === motionSession) paired = false; relay.textContent = T('renew'); return; }
  inFlight++;
  try {
    const joints = pose?.joints.map(j => ({x: j.x, y: j.y, z: j.z, confidence: j.confidence})) ||
      Array.from({length: 20}, () => ({x: 0, y: 0, z: 0, confidence: 0}));
    const response = onConsole ?
      await fetch('/api/motion/frame', {method: 'POST', headers: {'X-Key': consoleKey, 'Content-Type': 'application/octet-stream'},
        body: packFrame(target.session, target.sequence, !!pose, joints)}) :
      await fetch('/relay/frame', {method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({session: target.session, sequence: target.sequence, tracked: !!pose, joints})});
    if (!response.ok) {
      const result = await response.json().catch(() => ({}));
      if (onConsole && response.status === 409 && result.error === 'disabled') { relay.textContent = T('motion_off'); return; }
      if (onConsole && (response.status === 409 || response.status === 400)) return;  // an older or odd frame: skip it
      if (response.status === 403 && target === motionSession) pairing = 'expired';
      throw Error(response.status === 403 ? T('pairing_expired') : response.status === 502 ? T('ps5_lost') : result.error || T('rejected', response.status));
    }
    if (paired && target === motionSession) { relay.textContent = pose ? T('receiving') : T('receiving_lost'); sentTimes.push(performance.now()); }
  } catch (e) {
    if (target === motionSession) { paired = false; if (onConsole || pairing !== 'expired') pairing = 'lost'; }
    relay.textContent = e.message;
  } finally {
    inFlight--;
    // A loss admitted while paired must survive Stop/Hide/Disconnect. Its session owns its
    // counter even if the user reconnects before the pending POST ends.
    if (pendingLost) { const lostSession = pendingLost; pendingLost = null; void sendPose(null, lostSession); }
  }
}
async function connect(quiet = false) {
  try {
    const typed = $('key').value.trim().toLowerCase();
    let result;
    if (onConsole) {
      const response = await fetch('/api/motion/status', {headers: {'X-Key': typed}, cache: 'no-store'});
      if (response.status === 403) { pairing = 'wrong_key'; throw Error(T('banner_wrong_key')); }
      if (!response.ok) throw Error(T('ps5_lost'));
      result = await response.json();
      consoleKey = typed;
    } else {
      const response = await fetch('/relay/connect', {method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({key: typed})});
      result = await response.json();
      if (!response.ok) throw Error(result.error || T('pairing_expired'));
    }
    if (!result.enabled) throw Error(T('enable_motion'));
    tracker.resetMotion(); gestures.reset();
    motionSession = {session: crypto.getRandomValues(new Uint32Array(1))[0] || 1, sequence: 0};
    paired = true; pairing = 'paired'; nextSend = 0; lastGood = null; relay.textContent = T('paired');
  } catch (e) {
    paired = false;
    if (!quiet || pairing !== 'lost') relay.textContent = e.message;
    if (quiet && pairing === 'lost') relay.textContent = T('reconnecting');
  }
}
$('connect').onclick = () => connect();
// On the console the key stays the same across restarts: after a lost connection (the
// emulator restarting into a game) try again every two seconds, without any typing.
setInterval(() => {
  if (onConsole && !paired && (pairing === 'lost' || pairing === 'expired') && $('key').value.trim()) connect(true);
}, 2000);
if ($('key').value.trim()) setTimeout(() => connect(), 0);
$('disconnect').onclick = () => { sendPose(null); paired = false; pairing = 'none'; relay.textContent = T('console_disconnected'); };

async function loadModel(name) {
  if (models.has(name)) return models.get(name);
  const {PoseLandmarker, FilesetResolver} = await import(VISION + '/vision_bundle.mjs');
  const files = await FilesetResolver.forVisionTasks(VISION + '/wasm');
  const url = `https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_${name}/float16/1/pose_landmarker_${name}.task`;
  let lastError;
  // The phone's GPU first; the processor if the browser refuses it.
  for (const delegate of ['GPU', 'CPU']) {
    try {
      const model = await PoseLandmarker.createFromOptions(files, {baseOptions: {modelAssetPath: url, delegate},
        runningMode: 'VIDEO', numPoses: 1, minPoseDetectionConfidence: .5, minPosePresenceConfidence: .5, minTrackingConfidence: .5});
      const loaded = {model, delegate};
      models.set(name, loaded);
      return loaded;
    } catch (e) { lastError = e; }
  }
  throw lastError;
}

async function keepAwake() {
  try { wakeLock = await navigator.wakeLock?.request('screen'); } catch { wakeLock = null; }
}
function finish() {
  sendPose(null); tracker.resetMotion(); gestures.reset(); active = false; lastGood = null;
  cancelAnimationFrame(frame); clearTimeout(frame); stream?.getTracks().forEach(t => t.stop()); stream = null; video.srcObject = null;
  wakeLock?.release?.().catch(() => {}); wakeLock = null;
  stop.disabled = true; start.disabled = busy; cameraChoice.disabled = quality.disabled = busy; recenter.disabled = true; save.disabled = true;
  latest = null; showPose(null); status.textContent = T('camera_off'); document.body.classList.remove('focus');
}
start.onclick = async () => {
  busy = true; start.disabled = true; cameraChoice.disabled = quality.disabled = true;
  try {
    if (!demo) {
      if (!isSecureContext || !navigator.mediaDevices?.getUserMedia) throw Error(T('need_https'));
      status.textContent = T('loading_model');
      const loaded = await loadModel(quality.value);
      engine = quality.value + ' ' + loaded.delegate;
      stream = await navigator.mediaDevices.getUserMedia({video: {facingMode: cameraChoice.value, width: {ideal: 640}, height: {ideal: 480}, frameRate: {ideal: 30}}, audio: false});
      video.srcObject = stream; await video.play();
      if (document.hidden) { finish(); return; }
    } else engine = 'demo';
    tracker.resetCalibration(); gestures.reset(); active = true; lastVideoTime = -1;
    stop.disabled = false; recenter.disabled = false; focusButton.disabled = false; status.textContent = T('no_body');
    keepAwake(); loop();
  } catch (e) { finish(); status.textContent = e.message; } finally { busy = false; start.disabled = active; cameraChoice.disabled = quality.disabled = active; }
};

let demoModule = null, demoStart = null;
async function detect(now) {
  if (demo) {
    demoModule ??= await import('./demo_body.mjs?v=kinect5');
    demoStart ??= now;
    const {world, image} = demoModule.demoFrame(!Number.isFinite(demoHold) ? now / 1000 : now - demoStart < 2000 ? .5 : demoHold);
    return {world, image, width: 640, height: 480};
  }
  if (video.readyState < 2 || video.currentTime === lastVideoTime) return null;
  lastVideoTime = video.currentTime;
  const result = models.get(quality.value).model.detectForVideo(video, now);
  return {world: result.worldLandmarks[0], image: result.landmarks[0], width: video.videoWidth, height: video.videoHeight};
}

async function loop() {
  if (!active) return;
  try {
    const capturedAt = performance.now();
    const seen = await detect(capturedAt);
    if (seen) {
      const stale = performance.now() - capturedAt > 250;
      if (capturedAt > lastFrameAt) { const rate = 1000 / (capturedAt - lastFrameAt); fps = fps ? fps * .9 + rate * .1 : rate; }
      lastFrameAt = capturedAt;
      let tracked = null, info = '';
      if (stale || !seen.world || !seen.image) latest = null;
      else if (mode.value === 'kinect') {
        tracked = tracker.update(seen.world, seen.image, capturedAt, seen.width, seen.height);
        latest = tracked.pose;
        const root = tracked.status.root;
        info = root ? 'Root X ' + root.x.toFixed(2) + ' Y ' + root.y.toFixed(2) + ' distance ' + root.distance.toFixed(2) + ' m' : '';
      } else {
        const world = sides.value === 'mirror' ? mirrorLandmarks(seen.world, false) : seen.world;
        try { latest = skeleton(world, capturedAt); } catch { latest = null; }
      }
      gestures.update(mode.value === 'kinect' ? latest : null, capturedAt);
      showPose(latest, info); save.disabled = !latest;
      showStatus(stale, tracked);
      if (latest) lastGood = {pose: latest, at: capturedAt};
      const kept = !latest && lastGood && capturedAt - lastGood.at < GRACE_MS ? lastGood.pose : null;
      if (performance.now() >= nextSend) { nextSend = performance.now() + 33; sendPose(latest || kept); }
      draw(seen, stale ? null : latest, tracked);
    }
  } catch (e) { finish(); status.textContent = e.message; return; }
  // The demo keeps its own 30 Hz clock so it also runs in a background or occluded tab.
  frame = demo ? setTimeout(loop, 33) : requestAnimationFrame(loop);
}

function showStatus(stale, tracked) {
  if (stale) { status.textContent = T('frame_old'); return; }
  status.textContent = latest ? T('body') : T('no_body');
  if (mode.value !== 'kinect') { calibrationText.textContent = T('original'); progress.value = 0; return; }
  const s = tracked?.status;
  progress.value = s?.progress ?? 0;
  calibrationText.textContent = !s ? '' : s.reason === 'hips_hidden' ? T('hips_hidden') : s.calibrated && s.root ?
    T('tracking', s.root.distance.toFixed(2).replace('.', lang === 'en' ? '.' : ',')) : T('calibrating', Math.round(progress.value * 100));
}

// ---- Drawing -------------------------------------------------------------------------------
// Picture landmarks keep the drawing on top of the person; the tracked skeleton adds depth:
// a limb that comes towards the camera is drawn thicker and brighter, as on the sensor view.
const BONES = [[11, 13], [13, 15], [12, 14], [14, 16], [23, 25], [25, 27], [24, 26], [26, 28], [27, 31], [28, 32], [27, 29], [28, 30]];
const DEPTH_OF = {13: [5, 4], 15: [6, 4], 17: [7, 4], 19: [7, 4], 14: [9, 8], 16: [10, 8], 18: [11, 8], 20: [11, 8]};
const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const COLORS = {left: css('--left'), right: css('--right'), centre: '#eef3f6', accent: css('--accent')};
function draw(seen, pose, tracked) {
  const w = seen.width, h = seen.height;
  if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
  const mirror = !demo && cameraChoice.value === 'user', swapped = sides.value === 'mirror';
  const unit = Math.max(w, h) / 160;
  ctx.save();
  if (mirror) { ctx.translate(w, 0); ctx.scale(-1, 1); }
  if (!demo && video.readyState >= 2) ctx.drawImage(video, 0, 0, w, h); else { ctx.fillStyle = '#0b1018'; ctx.fillRect(0, 0, w, h); }
  ctx.fillStyle = 'rgba(5,8,12,.45)'; ctx.fillRect(0, 0, w, h);
  const p = seen.image;
  if (p && pose !== undefined) {
    const at = n => [p[n].x * w, p[n].y * h];
    const ok = n => p[n] && (p[n].visibility ?? 1) >= .5;
    const forward = n => {
      const link = DEPTH_OF[logical(n)];
      return link && pose ? Math.max(0, pose.joints[link[0]].z - pose.joints[link[1]].z) : 0;
    };
    const logical = n => swapped ? MIRRORED[n] : n;  // the side the game is told
    const side = n => logical(n) % 2 ? COLORS.left : COLORS.right;
    // Torso.
    if ([11, 12, 23, 24].every(ok)) {
      ctx.beginPath(); for (const n of [11, 12, 24, 23]) ctx.lineTo(...at(n)); ctx.closePath();
      ctx.fillStyle = 'rgba(238,243,246,.14)'; ctx.fill();
      ctx.lineWidth = unit * 1.6; ctx.strokeStyle = 'rgba(238,243,246,.85)'; ctx.lineJoin = 'round'; ctx.stroke();
    }
    ctx.lineCap = 'round';
    for (const [a, b] of BONES) {
      if (!ok(a) || !ok(b)) continue;
      const depth = 1 + Math.min(.6, forward(b)) * 2.2;
      ctx.beginPath(); ctx.moveTo(...at(a)); ctx.lineTo(...at(b));
      ctx.lineWidth = unit * 3.2 * depth; ctx.strokeStyle = 'rgba(0,0,0,.55)'; ctx.stroke();
      ctx.lineWidth = unit * 2.2 * depth; ctx.strokeStyle = side(b); ctx.stroke();
    }
    // Head, sized by the ears.
    if (ok(0) && ok(7) && ok(8)) {
      const [x, y] = at(0), r = Math.hypot((p[7].x - p[8].x) * w, (p[7].y - p[8].y) * h) * .72;
      ctx.beginPath(); ctx.arc(x, y, Math.max(r, unit * 3), 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(238,243,246,.18)'; ctx.fill(); ctx.lineWidth = unit * 1.6; ctx.strokeStyle = COLORS.centre; ctx.stroke();
    }
    // Hands: grow and glow as they reach towards the camera.
    for (const knuckles of [[17, 19], [18, 20]]) {
      const color = side(knuckles[0]);
      if (!knuckles.every(ok)) continue;
      const x = (p[knuckles[0]].x + p[knuckles[1]].x) / 2 * w, y = (p[knuckles[0]].y + p[knuckles[1]].y) / 2 * h;
      const reachForward = forward(knuckles[0]);
      ctx.save();
      if (reachForward > .25) { ctx.shadowColor = color; ctx.shadowBlur = unit * 8; }
      ctx.beginPath(); ctx.arc(x, y, unit * (3 + reachForward * 6), 0, Math.PI * 2);
      ctx.fillStyle = color; ctx.globalAlpha = .55 + Math.min(.45, reachForward); ctx.fill();
      ctx.restore();
    }
    for (const n of [11, 12, 13, 14, 15, 16, 23, 24, 25, 26, 27, 28]) {
      if (!ok(n)) continue;
      ctx.beginPath(); ctx.arc(...at(n), unit * 1.5, 0, Math.PI * 2); ctx.fillStyle = '#ffffff'; ctx.fill();
    }
  }
  ctx.restore();
  drawHud(w, h, unit, pose, tracked, mirror !== swapped);
}

function chip(text, x, y, unit, color) {
  ctx.font = `600 ${Math.round(unit * 5.2)}px system-ui,sans-serif`;
  const width = ctx.measureText(text).width + unit * 6, height = unit * 8.4;
  ctx.fillStyle = 'rgba(10,12,17,.78)'; ctx.beginPath(); ctx.roundRect(x, y, width, height, unit * 2); ctx.fill();
  ctx.fillStyle = color; ctx.fillRect(x + unit * 1.6, y + unit * 2, unit * .9, height - unit * 4);
  ctx.fillStyle = '#eef3f6'; ctx.textBaseline = 'middle'; ctx.fillText(text, x + unit * 3.6, y + height / 2 + unit * .2);
  return height + unit * 1.6;
}

function drawHud(w, h, unit, pose, tracked, mirror) {
  let y = unit * 3;
  const now = performance.now();
  const recent = gestures.events.filter(e => now - e.t < 1000).slice(-3);
  for (const e of recent) y += chip(T(e.name), unit * 3, y, unit, e.name.startsWith('left') ? COLORS.left : e.name.startsWith('right') ? COLORS.right : COLORS.accent);
  for (const s of gestures.states) y += chip(T(s), unit * 3, y, unit, '#f0b446');
  ctx.font = `${Math.round(unit * 3.6)}px system-ui,sans-serif`; ctx.textBaseline = 'top'; ctx.fillStyle = 'rgba(238,243,246,.7)';
  sentTimes = sentTimes.filter(at => now - at < 1000);
  const label = T('engine', engine, Math.round(fps)) + (paired ? '  ·  ' + T('sending', sentTimes.length) : '');
  ctx.fillText(label, w - ctx.measureText(label).width - unit * 3, unit * 3);
  if (!demo && fps && fps < 12) chip(T('slow'), unit * 3, h - unit * 12, unit, '#f0b446');
  if (!paired && !demo) {
    const text = onConsole && (pairing === 'lost' || pairing === 'expired') ? T('reconnecting') :
      pairing === 'wrong_key' ? T('banner_wrong_key') : pairing === 'expired' ? T('banner_expired') : T('banner_unpaired');
    ctx.font = `600 ${Math.round(unit * 5)}px system-ui,sans-serif`;
    const width = Math.min(w - unit * 6, ctx.measureText(text).width + unit * 8);
    ctx.fillStyle = 'rgba(120,70,0,.92)'; ctx.beginPath(); ctx.roundRect((w - width) / 2, h * .42, width, unit * 16, unit * 3); ctx.fill();
    ctx.fillStyle = '#fff4dc'; ctx.textBaseline = 'middle'; ctx.textAlign = 'center';
    ctx.fillText(text, w / 2, h * .42 + unit * 5.5, w - unit * 10);
    ctx.font = `${Math.round(unit * 3.4)}px system-ui,sans-serif`;
    ctx.fillText(onConsole ? T('reconnect_hint') : T('banner_hint'), w / 2, h * .42 + unit * 11.5, w - unit * 10);
    ctx.textAlign = 'start';
  }
  if (mode.value !== 'kinect') return;
  // Top view: where the body stands in front of the camera, and where the hands reach.
  const size = Math.min(w, h) * .36, x0 = w - size - unit * 3, y0 = h - size - unit * 3;
  ctx.fillStyle = 'rgba(10,12,17,.78)'; ctx.beginPath(); ctx.roundRect(x0, y0, size, size, unit * 2); ctx.fill();
  ctx.font = `${Math.round(unit * 3.2)}px system-ui,sans-serif`; ctx.fillStyle = 'rgba(238,243,246,.75)'; ctx.fillText(T('top_view'), x0 + unit * 2, y0 + unit * 1.6);
  const map = (x, d) => [x0 + size / 2 + (mirror ? -x : x) * size / 3.2, y0 + size - unit * 4 - (d - .8) * (size - unit * 10) / 3.2];
  ctx.strokeStyle = 'rgba(238,243,246,.16)'; ctx.lineWidth = unit * .4;
  for (const d of [1.5, 2.5, 3.5]) { const [, yy] = map(0, d); ctx.beginPath(); ctx.moveTo(x0 + unit * 2, yy); ctx.lineTo(x0 + size - unit * 2, yy); ctx.stroke(); }
  const [cx, cy] = map(0, .8); ctx.fillStyle = COLORS.accent; ctx.fillRect(cx - unit * 3, cy, unit * 6, unit * 1.6);
  if (!pose) return;
  const where = j => map(j.x, BODY_DISTANCE - j.z);
  const [bx, by] = where(pose.joints[0]);
  for (const [hand, color] of [[7, COLORS.left], [11, COLORS.right]]) {
    const [hx, hy] = where(pose.joints[hand]);
    ctx.strokeStyle = color; ctx.lineWidth = unit * 1.2; ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(hx, hy); ctx.stroke();
    ctx.beginPath(); ctx.arc(hx, hy, unit * 1.8, 0, Math.PI * 2); ctx.fillStyle = color; ctx.fill();
  }
  ctx.beginPath(); ctx.arc(bx, by, unit * 3, 0, Math.PI * 2); ctx.fillStyle = '#eef3f6'; ctx.fill();
}

focusButton.onclick = () => { document.body.classList.add('focus'); };
$('exit-focus').onclick = () => { document.body.classList.remove('focus'); };
stop.onclick = finish;
document.addEventListener('visibilitychange', () => { if (document.hidden) finish(); });
window.addEventListener('pagehide', finish);
save.onclick = () => {
  if (!latest) return;
  const url = URL.createObjectURL(new Blob([JSON.stringify(latest, null, 2)], {type: 'application/json'}));
  const a = document.createElement('a'); a.href = url; a.download = 'ps5x360-pose.json'; a.click(); setTimeout(() => URL.revokeObjectURL(url), 1000);
};
if (demo) start.click();
</script>
</html>
